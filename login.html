<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Fútbol y Más</title>

    <!-- Firebase SDKs (Compatibilidad v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-base: #0f1115;
            --bg-surface: #181b21;
            --bg-surface-hover: #22262d;
            --text-main: #f0f1f4;
            --text-muted: #8b929d;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: rgba(24, 27, 33, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header img {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            margin-bottom: 16px;
            object-fit: cover;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .auth-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Selector de pestañas */
        .auth-tabs {
            display: flex;
            background: var(--bg-base);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .auth-tab.active {
            background: var(--bg-surface);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* Formularios */
        .auth-form {
            display: none;
            flex-direction: column;
            gap: 18px;
        }

        .auth-form.active {
            display: flex;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider span {
            padding: 0 12px;
        }

        .btn-google {
            width: 100%;
            padding: 12px;
            background: var(--bg-surface-hover);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-google svg {
            width: 18px;
            height: 18px;
        }

        /* Notificaciones Toast */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #1e2229;
            border-left: 4px solid var(--accent);
            color: var(--text-main);
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        .toast.show {
            transform: translateX(0);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <img src="logo.png" alt="Fútbol y Más Logo" onerror="this.src='logo.jpg'">
            <h1>Fútbol y Más</h1>
            <p>Bienvenido a la comunidad oficial</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('login')">Iniciar Sesión</button>
            <button class="auth-tab" onclick="switchTab('register')">Registrarse</button>
        </div>

        <!-- FORMULARIO LOGIN -->
        <form id="form-login" class="auth-form active" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" class="form-input" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btn-login" class="btn-submit">Entrar a la Plataforma</button>
        </form>

        <!-- FORMULARIO REGISTRO -->
        <form id="form-register" class="auth-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="reg-name">Nombre Completo / Apodo</label>
                <input type="text" id="reg-name" class="form-input" placeholder="Ej: Marcos Costa" required>
            </div>
            <div class="form-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" class="form-input" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label for="reg-password">Contraseña (Mín. 6 caracteres)</label>
                <input type="password" id="reg-password" class="form-input" placeholder="••••••••" minlength="6" required>
            </div>
            <button type="submit" id="btn-register" class="btn-submit">Crear Mi Cuenta</button>
        </form>

        <div class="divider">
            <span>O continúa con</span>
        </div>

        <button type="button" class="btn-google" onclick="handleGoogleLogin()">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Acceder con Google
        </button>
    </div>

    <div id="toast-container"></div>

    <script src="login.js"></script>
</body>
</html>
