<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Fútbol y Más</title>

    <!-- Fuentes Oficiales de la Web -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Firebase SDKs (Compatibilidad v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        /* =========================================
           VARIABLES CSS (Estilos Oficiales)
           ========================================= */
        :root {
            --bg-color: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --accent: #e53e3e;
            --accent-hover: #c53030;
            --gold: #ecc94b;
            --panel-bg: #111111;
            --card-bg: #000000;
            --card-border: #222222;
            --nav-bg: #0a0a0a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1, h2, h3, .logo { font-family: 'Oswald', sans-serif; text-transform: uppercase; }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-header img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-bottom: 12px;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .auth-header h1 {
            font-size: 2rem;
            color: var(--accent);
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Tabs de Selección */
        .auth-tabs {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            margin-bottom: 20px;
            padding: 3px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: 'Roboto', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            background: var(--accent);
            color: var(--text-main);
        }

        /* Formulario */
        .auth-form {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form.active {
            display: flex;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            border-color: var(--accent);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: var(--text-main);
            border: none;
            border-radius: 4px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 5px;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--card-border);
        }

        .divider span {
            padding: 0 10px;
        }

        .btn-google {
            width: 100%;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
        }

        .btn-google:hover {
            border-color: var(--accent);
            background: var(--panel-bg);
        }

        .btn-google svg {
            width: 18px;
            height: 18px;
        }

        /* Notificaciones Toast */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--accent);
            color: var(--text-main);
            padding: 12px 18px;
            border-radius: 4px;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transform: translateX(120%);
            transition: transform 0.3s ease;
        }

        .toast.error {
            border-left-color: var(--accent);
        }

        .toast.success {
            border-left-color: var(--gold);
        }

        .toast.show {
            transform: translateX(0);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <img src="logo.png" alt="Fútbol y Más Logo" onerror="this.src='logo.jpg'">
            <h1>Fútbol y Más</h1>
            <p>Accede a tu cuenta de la comunidad</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('login')">Iniciar Sesión</button>
            <button class="auth-tab" onclick="switchTab('register')">Registrarse</button>
        </div>

        <!-- FORMULARIO LOGIN -->
        <form id="form-login" class="auth-form active" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" class="form-input" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btn-login" class="btn-submit">Entrar</button>
        </form>

        <!-- FORMULARIO REGISTRO -->
        <form id="form-register" class="auth-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="reg-name">Nombre de Usuario</label>
                <input type="text" id="reg-name" class="form-input" placeholder="Ej: Marcos Costa" required>
            </div>
            <div class="form-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" class="form-input" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label for="reg-password">Contraseña (Mín. 6 caracteres)</label>
                <input type="password" id="reg-password" class="form-input" placeholder="••••••••" minlength="6" required>
            </div>
            <button type="submit" id="btn-register" class="btn-submit">Crear Cuenta</button>
        </form>

        <div class="divider">
            <span>O continúa con</span>
        </div>

        <button type="button" class="btn-google" onclick="handleGoogleLogin()">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Google
        </button>
    </div>

    <div id="toast-container"></div>

    <script src="login.js"></script>
</body>
</html>
