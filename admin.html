<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de Administración</title>
    <style>
      :root{--bg:#ffffff;--card:#f7f7f7;--accent:#e53e3e;--muted:#666}
      body.doc-content{
        background-color:var(--bg);
        max-width:468pt;
        padding:72pt;
        font-family: Arial, Helvetica, sans-serif;
        color:#111;
        line-height:1.4;
      }
      header.admin-head{margin-bottom:20px}
      header.admin-head h1{font-size:20px;margin:0 0 8px}
      header.admin-head p{margin:0;color:var(--muted)}

      .admin-nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
      .admin-nav button{padding:10px 15px;border-radius:6px;border:0;cursor:pointer}
      .btn-primary{background:#1f6feb;color:#fff}
      .btn-muted{background:#eee;color:#333}

      .section{background:var(--card);padding:15px;border-radius:8px;margin-bottom:20px}
      .section h2{margin:0 0 8px;font-size:16px}
      .form-row{display:flex;gap:12px;align-items:center;margin:10px 0}
      .form-row label{min-width:160px;font-weight:600}
      input[type="text"], input[type="number"], select, textarea{
        padding:8px;border-radius:6px;border:1px solid #ddd;flex:1;max-width:100%
      }
      textarea{min-height:80px}
      .controls{display:flex;gap:8px;flex-wrap:wrap}

      footer{margin-top:30px;color:var(--muted);font-size:14px}
    </style>
  </head>

  <body class="doc-content">
    <header class="admin-head">
      <h1>Panel de Administración</h1>
      <p>Panel de control — gestión de contenidos, encuestas, debates y configuración del sitio.</p>
    </header>

    <nav class="admin-nav">
      <button class="btn-primary" data-target="panel-estado">Panel Estado</button>
      <button class="btn-muted" data-target="config-contenido">Config Contenido</button>
      <button class="btn-muted" data-target="encuestas">Encuestas</button>
      <button class="btn-muted" data-target="debates">Debates</button>
      <button class="btn-muted" data-target="publicar">Publicar</button>
    </nav>

    <main>
      <section id="panel-estado" class="section">
        <h2>Estado del Panel</h2>
        <p>Visitas totales: <strong>—</strong></p>
        <div class="form-row">
          <label for="visitas-totales">Visitas totales</label>
          <input id="visitas-totales" type="number" placeholder="0" />
        </div>
        <div class="controls">
          <button class="btn-primary">Actualizar</button>
          <button class="btn-muted">Restaurar por defecto</button>
        </div>
      </section>

      <section id="config-contenido" class="section">
        <h2>Configuración de Contenido</h2>
        <div class="form-row">
          <label for="seccion-activa">Sección activa</label>
          <select id="seccion-activa">
            <option value="home">Inicio</option>
            <option value="noticias">Noticias</option>
            <option value="debates">Debates</option>
            <option value="encuestas">Encuestas</option>
          </select>
        </div>
        <div class="form-row">
          <label for="publicar-delay">Delay de publicación (seg)</label>
          <input id="publicar-delay" type="number" min="0" value="0" />
        </div>
        <div class="form-row">
          <label for="cont-estado">Contenido destacado</label>
          <input id="cont-estado" type="text" placeholder="Título o resumen" />
        </div>
        <div class="controls">
          <button class="btn-primary">Guardar configuración</button>
          <button class="btn-muted">Cancelar</button>
        </div>
      </section>

      <section id="encuestas" class="section">
        <h2>Encuestas</h2>
        <div class="form-row">
          <label for="encuesta-titulo">Título</label>
          <input id="encuesta-titulo" type="text" placeholder="Título de la encuesta" />
        </div>
        <div class="form-row">
          <label for="encuesta-opciones">Opciones (separadas por comas)</label>
          <input id="encuesta-opciones" type="text" placeholder="Sí,No,Tal vez" />
        </div>
        <div class="controls">
          <button class="btn-primary">Crear encuesta</button>
          <button class="btn-muted">Ver historial</button>
        </div>
      </section>

      <section id="debates" class="section">
        <h2>Debates</h2>
        <div class="form-row">
          <label for="debate-titulo">Título</label>
          <input id="debate-titulo" type="text" placeholder="Título del debate" />
        </div>
        <div class="form-row">
          <label for="debate-contenido">Contenido</label>
          <textarea id="debate-contenido" placeholder="Escribe el cuerpo del debate..."></textarea>
        </div>
        <div class="controls">
          <button class="btn-primary">Publicar debate</button>
          <button class="btn-muted">Historial de debates</button>
        </div>
      </section>

      <section id="cuentas" class="section">
        <h2>Seguridad y Cuentas</h2>
        <div class="form-row">
          <label for="usuario">Usuario</label>
          <input id="usuario" type="text" placeholder="admin" />
        </div>
        <div class="form-row">
          <label for="nueva-clave">Cambiar contraseña</label>
          <input id="nueva-clave" type="password" placeholder="Nueva contraseña" />
        </div>
        <div class="controls">
          <button class="btn-primary">Guardar contraseña</button>
        </div>
      </section>

    </main>

    <footer>
      <p>Panel generado — Futbol y Mas</p>
    </footer>
  </body>
</html>
