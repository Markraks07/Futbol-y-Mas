<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - FYM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo"><img src="logo.png"><h1>Panel <span>Admin</span></h1></div>
    <nav><a href="index.html">Volver a Web</a></nav>
  </header>
  <section>
    <h2>Añadir <span>Nuevo Socio</span></h2>
    <div class="admin-panel">
      <form id="form-socio">
        <input type="number" id="numero" min="1" max="10" placeholder="Número 1-10" required>
        <input type="text" id="nombre" placeholder="Nombre del Socio" required>
        <input type="text" id="imagen" placeholder="Link de Imagen B/N" required>
        <input type="text" id="privilegio" placeholder="Privilegio del Socio">
        <button type="submit" class="btn">Guardar Socio</button>
      </form>
    </div>
  </section>
  <script type="module" src="script.js"></script>
</body>
</html>
